    <script>
      // 1. Guard Object.defineProperty / defineProperties / Reflect.defineProperty at 0ms (before external stylesheets)
      // Prevents conflicting browser wallet extensions (e.g. Phantom evmAsk.js + MetaMask)
      // from throwing "TypeError: Cannot redefine property: ethereum"
      (function() {
        var WALLET_GLOBALS = {
          ethereum: true,
          web3: true,
          phantom: true,
          solana: true,
          okxwallet: true,
          rabby: true,
          coinbaseWalletExtension: true,
          trustwallet: true
        };

        var origDefineProperty = Object.defineProperty;
        var origDefineProperties = Object.defineProperties;
        var origGetOwnPropertyDescriptor = Object.getOwnPropertyDescriptor;

        function isWindowTarget(target) {
          return target === window || target === globalThis;
        }

        Object.defineProperty = function(target, prop, descriptor) {
          if (isWindowTarget(target) && prop && WALLET_GLOBALS[String(prop)]) {
            try {
              var existing = origGetOwnPropertyDescriptor.call(Object, target, prop);
              if (existing && existing.configurable === false) {
                if (existing.writable && descriptor && 'value' in descriptor) {
                  try { target[prop] = descriptor.value; } catch (_err) {}
                }
                return target;
              }
              var safeDesc = {};
              if (descriptor && typeof descriptor === 'object') {
                var descKeys = Object.keys(descriptor);
                for (var k = 0; k < descKeys.length; k++) {
                  var key = descKeys[k];
                  safeDesc[key] = descriptor[key];
                }
                if ('get' in descriptor && !('get' in safeDesc)) safeDesc.get = descriptor.get;
                if ('set' in descriptor && !('set' in safeDesc)) safeDesc.set = descriptor.set;
                if ('value' in descriptor && !('value' in safeDesc)) safeDesc.value = descriptor.value;
                if ('writable' in descriptor && !('writable' in safeDesc)) safeDesc.writable = descriptor.writable;
                if ('enumerable' in descriptor && !('enumerable' in safeDesc)) safeDesc.enumerable = descriptor.enumerable;
              }
              safeDesc.configurable = true;
              return origDefineProperty.call(Object, target, prop, safeDesc);
            } catch (_e) {
              return target;
            }
          }
          try {
            return origDefineProperty.call(Object, target, prop, descriptor);
          } catch (err) {
            if (
              isWindowTarget(target) &&
              err instanceof TypeError &&
              String(err.message || '').indexOf('Cannot redefine property') !== -1
            ) {
              return target;
            }
            throw err;
          }
        };

        if (origDefineProperties) {
          Object.defineProperties = function(target, props) {
            if (isWindowTarget(target) && props && typeof props === 'object') {
              try {
                var keys = Object.keys(props);
                var hasWalletKey = false;
                for (var i = 0; i < keys.length; i++) {
                  if (WALLET_GLOBALS[keys[i]]) {
                    hasWalletKey = true;
                    break;
                  }
                }
                if (hasWalletKey) {
                  for (var j = 0; j < keys.length; j++) {
                    Object.defineProperty(target, keys[j], props[keys[j]]);
                  }
                  return target;
                }
              } catch (_e) {
                return target;
              }
            }
            try {
              return origDefineProperties.call(Object, target, props);
            } catch (err) {
              if (
                isWindowTarget(target) &&
                err instanceof TypeError &&
                String(err.message || '').indexOf('Cannot redefine property') !== -1
              ) {
                return target;
              }
              throw err;
            }
          };
        }

        if (typeof Reflect !== 'undefined' && Reflect.defineProperty) {
          var origReflectDefineProperty = Reflect.defineProperty;
          Reflect.defineProperty = function(target, prop, descriptor) {
            if (isWindowTarget(target) && prop && WALLET_GLOBALS[String(prop)]) {
              try {
                Object.defineProperty(target, prop, descriptor);
                return true;
              } catch (_e) {
                return true;
              }
            }
            try {
              return origReflectDefineProperty.call(Reflect, target, prop, descriptor);
            } catch (_e) {
              return false;
            }
          };
        }
      })();

      // 2. Safe WebSocket shim for Vite HMR in cloud preview environment (HMR is disabled in AI Studio iframe)
      if (typeof window !== 'undefined' && window.WebSocket) {
        var NativeWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          var isHmr = false;
          try {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('ais-dev-') !== -1 ||
              urlStr.indexOf('localhost') !== -1
            ) {
              isHmr = true;
            }
          } catch (e) {}

          if (isHmr) {
            var listeners = {};
            var dummyWs = {
              readyState: 1, // WebSocket.OPEN
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              url: String(url || ''),
              protocol: 'vite-hmr',
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              send: function() {},
              close: function() {
                dummyWs.readyState = 3;
              },
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function() {
                    try { fn.call(dummyWs, { type: 'open' }); } catch (err) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
            setTimeout(function() {
              if (typeof dummyWs.onopen === 'function') {
                try { dummyWs.onopen.call(dummyWs, { type: 'open' }); } catch (err) {}
              }
            }, 0);
            return dummyWs;
          }
          return new NativeWebSocket(url, protocols);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      }

      // 3. Suppress console.error / console.warn for ignorable WebSocket HMR and extension noise
      var _origConsoleError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        var text = args.map(function(a) { return (a && a.stack) ? String(a.stack) : String(a || ''); }).join(' ');
        if (
          text.indexOf('WebSocket closed without opened') !== -1 ||
          (text.indexOf('WebSocket') !== -1 && text.indexOf('vite') !== -1) ||
          text.indexOf('Cannot redefine property: ethereum') !== -1 ||
          text.indexOf('chrome-extension://') !== -1
        ) {
          return;
        }
        _origConsoleError.apply(console, args);
      };

      // 4. Suppress extension errors and WebSocket HMR disconnects in window error events
      function isIgnorableError(msg, src) {
        var m = String(msg || '');
        var s = String(src || '');
        return (
          s.indexOf('chrome-extension://') !== -1 ||
          s.indexOf('moz-extension://') !== -1 ||
          m.indexOf('ethereum') !== -1 ||
          m.indexOf('Cannot redefine property') !== -1 ||
          m.indexOf('WebSocket') !== -1 ||
          m.indexOf("reading 'send'") !== -1 ||
          m.indexOf('vite:ws') !== -1
        );
      }

      window.addEventListener('error', function(event) {
        if (isIgnorableError(event.message || event.error?.message, event.filename)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var msg = event?.reason?.message || String(event?.reason || '');
        if (isIgnorableError(msg, '')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.onerror = function(msg, url) {
        if (isIgnorableError(msg, url)) {
          return true;
        }
      };
    </script>
