    <script>
      // Gracefully handle HMR/WebSocket disconnects in cloud iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event?.reason?.message || '';
        if (msg.includes("reading 'send'") || msg.includes('WebSocket') || msg.includes('vite:ws')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event?.message || '';
        if (msg.includes("reading 'send'") || msg.includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
