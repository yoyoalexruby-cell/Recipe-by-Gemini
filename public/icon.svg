<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Warm Terracotta Leather) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9683E" />
      <stop offset="50%" stop-color="#C0532C" />
      <stop offset="100%" stop-color="#933516" />
    </linearGradient>

    <!-- Parchment Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F4ECE1" />
    </linearGradient>

    <!-- Golden Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="50%" stop-color="#FDA085" />
      <stop offset="100%" stop-color="#D4862E" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3A180E" flood-opacity="0.32" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C0532C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS-Style Squircle Frame -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Subtle Vintage Grid/Dotted Background Texture -->
  <g opacity="0.12">
    <circle cx="80" cy="80" r="3" fill="#FFF" />
    <circle cx="160" cy="80" r="3" fill="#FFF" />
    <circle cx="240" cy="80" r="3" fill="#FFF" />
    <circle cx="320" cy="80" r="3" fill="#FFF" />
    <circle cx="400" cy="80" r="3" fill="#FFF" />
    <circle cx="80" cy="432" r="3" fill="#FFF" />
    <circle cx="160" cy="432" r="3" fill="#FFF" />
    <circle cx="240" cy="432" r="3" fill="#FFF" />
    <circle cx="320" cy="432" r="3" fill="#FFF" />
    <circle cx="400" cy="432" r="3" fill="#FFF" />
  </g>

  <!-- Open Recipe Journal Book (Left Page & Right Page) -->
  <g filter="url(#cardShadow)">
    <!-- Leather Cover Base Under Book -->
    <rect x="74" y="94" width="364" height="324" rx="28" fill="#5A2E1A" opacity="0.4" />
    
    <!-- Left Page (Curved deckle edge look) -->
    <path d="M96 116 C160 112, 230 118, 252 126 L252 396 C228 388, 160 384, 96 388 C86 388, 80 380, 80 370 L80 134 C80 124, 86 116, 96 116 Z" fill="url(#pageGrad)" stroke="#E8DBCB" stroke-width="2" />
    
    <!-- Left Page Handwritten Lines Impression -->
    <path d="M106 160 Q170 156 226 162" stroke="#D1C3B2" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M106 186 Q170 182 226 188" stroke="#D1C3B2" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M106 212 Q170 208 226 214" stroke="#D1C3B2" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M106 238 Q170 234 226 240" stroke="#D1C3B2" stroke-width="3" stroke-linecap="round" opacity="0.3" />

    <!-- Cute mini pan sketch on left page -->
    <g opacity="0.4" transform="translate(136, 280) scale(0.7)">
      <circle cx="40" cy="40" r="28" fill="none" stroke="#C0532C" stroke-width="4" />
      <path d="M64 54 L94 76" stroke="#C0532C" stroke-width="5" stroke-linecap="round" />
      <path d="M30 32 Q40 22 50 32" stroke="#C0532C" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Page (Spacious recipe hero page) -->
    <path d="M260 126 C282 118, 352 112, 416 116 C426 116, 432 124, 432 134 L432 370 C432 380, 426 388, 416 388 C352 384, 282 388, 260 396 Z" fill="#FFFDF9" stroke="#E8DBCB" stroke-width="2" />

    <!-- Book Spine / Stitching Binding -->
    <line x1="256" y1="120" x2="256" y2="400" stroke="#D4A373" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="256" y1="120" x2="256" y2="400" stroke="#8C532B" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" />
  </g>

  <!-- Washi Tape Accents -->
  <!-- Top Right Floral/Striped Tape -->
  <g transform="translate(360, 96) rotate(18)">
    <rect x="-10" y="-8" width="80" height="22" rx="2" fill="#E07A5F" opacity="0.85" />
    <line x1="6" y1="3" x2="64" y2="3" stroke="#FFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
  </g>

  <!-- Bottom Sage Herb Tape -->
  <g transform="translate(350, 360) rotate(-8)">
    <rect x="-10" y="-8" width="76" height="20" rx="2" fill="#819871" opacity="0.85" />
    <line x1="4" y1="2" x2="62" y2="2" stroke="#FFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- Chef Hat & Steam Swirl Emblem (Right Page Center) -->
  <g transform="translate(346, 246)" filter="url(#softGlow)">
    <!-- Steam Swirls Rising -->
    <path d="M-22 -82 C-32 -106, -14 -122, -24 -144" fill="none" stroke="#D4862E" stroke-width="5" stroke-linecap="round" />
    <path d="M0 -90 C12 -114, -8 -130, 4 -154" fill="none" stroke="#E5883C" stroke-width="6" stroke-linecap="round" />
    <path d="M22 -82 C12 -106, 30 -122, 20 -144" fill="none" stroke="#D4862E" stroke-width="5" stroke-linecap="round" />

    <!-- Stitched Golden Chef Hat -->
    <!-- Base Ribbon -->
    <path d="M-42 6 C-42 6, 0 12, 42 6 L46 22 C46 26, 40 30, 36 30 L-36 30 C-40 30, -46 26, -46 22 Z" fill="url(#goldGrad)" stroke="#B66B1D" stroke-width="3" />
    
    <!-- Hat Puffs -->
    <path d="M-42 6 C-62 -12, -56 -48, -32 -56 C-24 -78, 0 -84, 18 -72 C36 -82, 58 -66, 52 -44 C66 -32, 64 -2, 42 6 Z" fill="url(#goldGrad)" stroke="#B66B1D" stroke-width="3" />

    <!-- Delicate Inner Stitching Line -->
    <path d="M-36 0 C-52 -14, -48 -42, -28 -48 C-20 -66, -2 -70, 14 -60 C28 -68, 46 -56, 42 -38 C52 -28, 50 -4, 36 0" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-dasharray="4 3" opacity="0.85" />
    
    <!-- Mini Star Sparkle -->
    <path d="M48 -58 L52 -50 L60 -46 L52 -42 L48 -34 L44 -42 L36 -46 L44 -50 Z" fill="#F6D365" opacity="0.9" />
  </g>
</svg>
